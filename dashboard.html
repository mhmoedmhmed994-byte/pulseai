<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseAI - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <div class="dash-bg"></div>

  <div class="dash-content">
    <header>
      <div class="logo">
        <span class="pulse-icon">📈</span>
        <span class="logo-text">PulseAI</span>
      </div>
      <button class="lang">🌐 EN</button>
    </header>

    <div class="tabs">
      <button class="tab active">Symptoms</button>
      <button class="tab">Nutrition</button>
      <button class="tab">Fitness</button>
    </div>

    <div class="input-card">
      <textarea placeholder="Write here..."></textarea>
    </div>

    <button class="analyze">Analyze</button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
