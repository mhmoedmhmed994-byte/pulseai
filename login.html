<!DOCTYPE html>
<html lang="ar">
<head>

  <title>Login</title>
  <link rel="stylesheet" href="style.css" />

<body>

    <h1>تسجيل دخول</h1>

  <script src="supabase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
