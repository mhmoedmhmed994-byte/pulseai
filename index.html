<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>حجز موعد طبي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>حجز موعد طبي</h1>
    <p class="subtitle">اختر الموعد المناسب واحجز فورًا</p>

    <form id="bookingForm">
      <label>اسم المريض</label>
      <input type="text" id="name" required />

      <label>رقم الموبايل</label>
      <input type="tel" id="phone" required />

      <label>اختر اليوم</label>
      <select id="day">
        <option>السبت</option>
        <option>الأحد</option>
        <option>الإثنين</option>
        <option>الثلاثاء</option>
      </select>

      <label>اختر الساعة</label>
      <select id="time">
        <option>10:00 صباحًا</option>
        <option>12:00 ظهرًا</option>
        <option>2:00 مساءً</option>
        <option>5:00 مساءً</option>
      </select>

      <button type="submit">تأكيد الحجز</button>
    </form>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
