<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PulseAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">PulseAI</div>

  <select id="langSelect">
    <option value="EN">EN</option>
    <option value="AR">AR</option>
    <option value="ZH">中文</option>
  </select>
</header>

<main>
  <nav>
    <button onclick="showSection('symptoms')" id="btnSymptoms"></button>
    <button onclick="showSection('nutrition')" id="btnNutrition"></button>
    <button onclick="showSection('fitness')" id="btnFitness"></button>
  </nav>

  <h1 id="title"></h1>
  <p id="desc"></p>

  <textarea id="userInput" placeholder="Type here..."></textarea>

  <button id="analyzeBtn"></button>

  <div id="result"></div>
</main>

<footer>
  PulseAI © 2026
</footer>

<script src="script.js"></script>
</body>
</html>
