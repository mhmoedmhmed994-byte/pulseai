<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>Clinic Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1 id="siteTitle">حجز موعد طبي</h1>

  <div class="top-actions">
    <select id="langSelect">
      <option value="AR">العربية</option>
      <option value="EN">English</option>
      <option value="ZH">中文</option>
    </select>

    <select id="serviceSelect">
      <option value="general">صحة عامة</option>
      <option value="nutrition">تغذية</option>
      <option value="fitness">لياقة بدنية</option>
    </select>
  </div>
</header>

<main>
  <p id="descText">احجز موعدك بسهولة بدون تعقيد</p>

  <input type="text" id="name" placeholder="الاسم الكامل" />
  <input type="tel" id="phone" placeholder="رقم الهاتف" />
  <input type="date" id="date" />
  <input type="time" id="time" />

  <button id="bookBtn">تأكيد الحجز</button>

  <p id="result"></p>

  <div class="contact">
    <p id="contactText">تواصل معنا</p>

    <a href="mailto:clinic@email.com" class="contact-btn email">
      📧 البريد الإلكتروني
    </a>

    <a href="https://wa.me/201223547704" target="_blank" class="contact-btn whatsapp">
      💬 واتساب
    </a>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
