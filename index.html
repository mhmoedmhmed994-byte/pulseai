<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Service Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

  <header>
    <h1 id="title">حجز خدمة بسهولة</h1>

    <div class="controls">
      <select id="language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>

      <select id="service">
        <option value="general">صحة عامة</option>
        <option value="nutrition">تغذية</option>
        <option value="fitness">لياقة بدنية</option>
      </select>
    </div>
  </header>

  <p id="description">احجز موعدك في أقل من دقيقة</p>

  <input id="name" type="text" placeholder="الاسم الكامل">
  <input id="phone" type="tel" placeholder="رقم الهاتف">
  <input id="date" type="date">
  <input id="time" type="time">

  <button id="bookBtn">تأكيد الحجز</button>

  <p id="result"></p>

  <div class="contact">
    <p id="contactTitle">تواصل معنا</p>
    <a href="mailto:contact@email.com" class="btn email">📧 Email</a>
    <a href="https://wa.me/201223547704" target="_blank" class="btn whatsapp">💬 WhatsApp</a>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
