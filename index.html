<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAI Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>PulseAI</h1>
    <p>تسجيل الدخول</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn" class="btn primary">Login</button>
    <button id="googleBtn" class="btn google">Login with Google</button>
    <button id="guestBtn" class="btn guest">Continue as Guest</button>

    <p class="small">
      ما عندكش حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
    </p>

    <p id="status"></p>
  </div>

  <script type="module">
    import { login, googleLogin, guestLogin } from "./auth.js";

    const status = document.getElementById("status");

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await login(email, password);
      if (error) status.innerText = error.message;
      else window.location.href = "dashboard.html";
    });

    document.getElementById("googleBtn").addEventListener("click", async () => {
      await googleLogin();
    });

    document.getElementById("guestBtn").addEventListener("click", () => {
      guestLogin();
    });
  </script>
</body>
</html>
