<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseAI Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>PulseAI</h1>
    <p>إنشاء حساب جديد</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="signupBtn" class="btn primary">Sign Up</button>
    <p class="small">
      عندك حساب؟ <a href="index.html">Login</a>
    </p>

    <p id="status"></p>
  </div>

  <script type="module">
    import { signup } from "./auth.js";

    const status = document.getElementById("status");

    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await signup(email, password);
      if (error) status.innerText = error.message;
      else {
        status.innerText = "Account created! Check your email to confirm.";
      }
    });
  </script>
</body>
</html>
